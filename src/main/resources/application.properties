# ============================================================
# LOCAL DEVELOPMENT CONFIGURATION (H2 File-mode)
# ============================================================
spring.application.name=mhc-dashboard

# H2 File Database (persists between restarts locally)
spring.datasource.url=jdbc:h2:file:./data/mhc_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (available at http://localhost:8080/h2-console in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Data initialization disabled (Flyway will handle this)
spring.sql.init.mode=never

# Server
server.port=8081

# CORS allowed origins (dev: all, override via env var)
app.cors.allowed-origins=http://localhost:4200
